name: SculptorAI CI/CD Pipeline

on:
  push:
    branches: [ main, feat/*, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test, Security & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Run Unit, Security & E2E Test Suite
        run: npm test
        env:
          NODE_ENV: test
          DEMO_MODE: "true"

      - name: Run AI Benchmark Evaluation Suite
        run: npm run test:evals
        env:
          NODE_ENV: test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-supabase.sculptor.ai"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key-for-static-compilation"
          DEMO_MODE: "true"
